apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatwoot-routing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dolfino/vps-k8s-infra.git
    targetRevision: main
    path: apps/03-business/chatwoot-routing
  destination:
    server: https://kubernetes.default.svc
    namespace: business
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
