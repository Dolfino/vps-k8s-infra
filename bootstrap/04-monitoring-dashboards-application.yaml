apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dashboards
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Dolfino/vps-k8s-infra.git
    targetRevision: main
    path: apps/04-monitoring/dashboards

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
