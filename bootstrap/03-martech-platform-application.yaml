apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: martech-platform, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/Dolfino/vps-k8s-infra.git
    targetRevision: main
    path: apps/03-business/martech-platform
  destination: {server: https://kubernetes.default.svc, namespace: business}
  syncPolicy:
    automated: {selfHeal: true, prune: false}
    syncOptions: [CreateNamespace=false]
