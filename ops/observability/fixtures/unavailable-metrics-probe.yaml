apiVersion: v1
kind: Pod
metadata:
  name: unavailable-metrics-probe
  labels:
    app: unavailable-metrics-probe
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - sleep 900
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: unavailable-metrics-probe
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "65535"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: unavailable-metrics-probe
  ports:
    - name: metrics
      port: 65535
      targetPort: 65535
