crds:
  create: false

alloy:
  enableReporting: false

  # Necessário para os probes do Kubernetes; não haverá Service nem Ingress.
  listenAddr: 0.0.0.0

  storagePath: /tmp/alloy

  mounts:
    varlog: false
    dockercontainers: false
    extra:
      - name: alloy-storage
        mountPath: /tmp/alloy

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  configMap:
    create: true
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "replace"
          target_label  = "app"
        }

        rule {
          source_labels = [
            "__meta_kubernetes_namespace",
            "__meta_kubernetes_pod_container_name",
          ]
          action       = "replace"
          separator    = "/"
          target_label = "job"
          replacement  = "$1"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster = "lab-sre",
            source  = "kubernetes-pods",
          }
        }

        forward_to = [loki.write.internal.receiver]
      }

      loki.source.kubernetes_events "cluster_events" {
        job_name   = "integrations/kubernetes/eventhandler"
        log_format = "logfmt"
        forward_to = [loki.process.cluster_events.receiver]
      }

      loki.process "cluster_events" {
        stage.static_labels {
          values = {
            cluster = "lab-sre",
            source  = "kubernetes-events",
          }
        }

        forward_to = [loki.write.internal.receiver]
      }

      loki.write "internal" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: deployment
  replicas: 1

  # Evita dois coletores simultâneos durante um rollout.
  updateStrategy:
    type: Recreate

  hostNetwork: false
  hostPID: false

  volumes:
    extra:
      - name: alloy-storage
        emptyDir: {}

service:
  enabled: false

ingress:
  enabled: false

serviceMonitor:
  enabled: false

rbac:
  create: true

  # Substitui o conjunto amplo padrão do chart.
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
        - namespaces
      verbs:
        - get
        - list
        - watch

    - apiGroups:
        - ""
      resources:
        - pods/log
      verbs:
        - get

    - apiGroups:
        - ""
      resources:
        - events
      verbs:
        - get
        - list
        - watch

serviceAccount:
  create: true
  automountServiceAccountToken: true
