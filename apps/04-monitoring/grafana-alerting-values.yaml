alerting:
  rules.yaml:
    apiVersion: 1
    deleteRules:
      - orgId: 1
        uid: pvc-usage-high
      - orgId: 1
        uid: pvc-usage-critical
    groups:
      - orgId: 1
        name: SREAlertRules
        folder: SRE Alerts
        interval: 1m
        rules:
          - uid: sre-alert-pipeline-probe
            title: SREAlertPipelineProbe
            condition: C
            for: 0s
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: warning
            annotations:
              summary: "Probe sintético de teste de pipeline de alertas"
            data:
              - refId: A
                datasourceUid: victoriametrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: "vector(1)"
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold

          - uid: sre-target-down
            title: SRETargetDown
            condition: C
            for: 2m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: 'Target {{ `{{ $labels.job }}` }} ({{ `{{ $labels.instance }}` }}) está indisponível'
            data:
              - refId: A
                datasourceUid: victoriametrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: "up"
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold

          - uid: evolution-api-not-ready
            title: EvolutionAPINotReady
            condition: C
            for: 2m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: "Evolution API não possui réplicas prontas"
            data:
              - refId: A
                datasourceUid: victoriametrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'kube_deployment_status_replicas_available{namespace="business",deployment="evolution-api"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold

          - uid: pod-restart-loop
            title: PodRestartLoop
            condition: C
            for: 1m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: warning
            annotations:
              summary: 'Pod {{ `{{ $labels.pod }}` }} no namespace {{ `{{ $labels.namespace }}` }} reiniciando frequentemente'
            data:
              - refId: A
                datasourceUid: victoriametrics
                relativeTimeRange:
                  from: 900
                  to: 0
                model:
                  editorMode: code
                  expr: 'increase(kube_pod_container_status_restarts_total[15m])'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 900
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 900
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 3
                        type: gte
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold

          - uid: ingress-5xx-rate-high
            title: Ingress5xxRateHigh
            condition: C
            for: 5m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: "Taxa de erro 5xx da Evolution API Ingress acima de 5%"
            data:
              - refId: A
                datasourceUid: victoriametrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: '(sum(rate(traefik_service_requests_total{service="business-evolution-api-8080@kubernetes",code=~"5.."}[5m])) / clamp_min(sum(rate(traefik_service_requests_total{service="business-evolution-api-8080@kubernetes"}[5m])), 0.001)) * 100'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold

          - uid: pvc-not-bound
            title: PVCNotBound
            condition: C
            for: 10m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: warning
            annotations:
              summary: 'PVC {{ `{{ $labels.persistentvolumeclaim }}` }} no namespace {{ `{{ $labels.namespace }}` }} com status não-Bound (Pending ou Lost)'
            data:
              - refId: A
                datasourceUid: victoriametrics
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  editorMode: code
                  expr: 'max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"})'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold

          - uid: pvc-lost
            title: PVCLost
            condition: C
            for: 1m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: 'PVC {{ `{{ $labels.persistentvolumeclaim }}` }} no namespace {{ `{{ $labels.namespace }}` }} em estado Lost'
            data:
              - refId: A
                datasourceUid: victoriametrics
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  editorMode: code
                  expr: 'max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_status_phase{phase="Lost"})'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold
