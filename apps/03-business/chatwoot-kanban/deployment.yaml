apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatwoot-kanban
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwoot-kanban
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwoot-kanban
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chatwoot-kanban
          # Multi-arch image produced by commit 328069b3691c5a6d1c2f983df004aba0d089ba23.
          image: ghcr.io/dolfino/chatwoot-kanban@sha256:377279b392b43b4176e3a0b62216244fe023342df72753d9067c5cb4b8b03c82
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: chatwoot-kanban-config
            - secretRef:
                name: chatwoot-kanban-runtime-auth
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
