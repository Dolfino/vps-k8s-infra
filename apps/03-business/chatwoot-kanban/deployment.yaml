apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatwoot-kanban
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwoot-kanban
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwoot-kanban
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chatwoot-kanban
          # Multi-arch image produced by commit 0ab91008440fb250e9bcb0817d37c18a400d41f5.
          image: ghcr.io/dolfino/chatwoot-kanban@sha256:f476a042f1f5ef27144669d516115e1cd866bc5b4248f34f0c36fb3928e79b20
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: chatwoot-kanban-config
            - secretRef:
                name: chatwoot-kanban-runtime-auth
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
