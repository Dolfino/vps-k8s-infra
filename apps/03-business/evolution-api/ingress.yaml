apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: evolution-api-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evolution-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: business-evolution-api-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: evo.ideiasmkt.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: evolution-api
                port:
                  number: 8080
  tls:
    - hosts:
        - evo.ideiasmkt.com.br
      secretName: evolution-api-tls
