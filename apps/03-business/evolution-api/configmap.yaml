apiVersion: v1
kind: ConfigMap
metadata:
  name: evolution-api-config
data:
  SERVER_NAME: evolution-api
  SERVER_TYPE: http
  SERVER_PORT: "8080"
  SERVER_URL: https://evo.ideiasmkt.com.br

  CORS_ORIGIN: "*"
  CORS_METHODS: GET,POST,PUT,DELETE
  CORS_CREDENTIALS: "false"

  TELEMETRY_ENABLED: "false"
  PROMETHEUS_METRICS: "false"

  LOG_LEVEL: ERROR,WARN,INFO,LOG
  LOG_COLOR: "false"
  LOG_BAILEYS: error
  EVENT_EMITTER_MAX_LISTENERS: "50"
  DEL_INSTANCE: "false"

  DATABASE_PROVIDER: psql_bouncer
  DATABASE_CONNECTION_CLIENT_NAME: evolution_lab

  DATABASE_SAVE_DATA_INSTANCE: "true"
  DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
  DATABASE_SAVE_MESSAGE_UPDATE: "true"
  DATABASE_SAVE_DATA_CONTACTS: "true"
  DATABASE_SAVE_DATA_CHATS: "true"
  DATABASE_SAVE_DATA_LABELS: "true"
  DATABASE_SAVE_DATA_HISTORIC: "true"

  CACHE_REDIS_ENABLED: "true"
  CACHE_REDIS_TTL: "604800"
  CACHE_REDIS_PREFIX_KEY: evolution
  CACHE_REDIS_SAVE_INSTANCES: "false"
  CACHE_LOCAL_ENABLED: "false"

  S3_ENABLED: "true"
  S3_BUCKET: evolution-media
  S3_PORT: "9000"
  S3_ENDPOINT: minio.storage.svc.cluster.local
  S3_REGION: us-east-1
  S3_USE_SSL: "false"
  S3_SKIP_POLICY: "true"
  S3_SAVE_VIDEO: "false"

  RABBITMQ_ENABLED: "false"
