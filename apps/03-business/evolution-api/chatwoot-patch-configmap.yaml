apiVersion: v1
kind: ConfigMap
metadata:
  name: evolution-chatwoot-patch
data:
  patch-chatwoot.js: |
    const fs = require('fs');

    const bundlePath = process.env.BUNDLE_PATH || '/patched-dist/main.mjs';
    const bundle = fs.readFileSync(bundlePath, 'utf8');
    const startMarker = 'async findContactByIdentifier(s,e){';
    const endMarker = '}async findContact(s,e){';
    const start = bundle.indexOf(startMarker);
    const end = bundle.indexOf(endMarker, start);

    if (start < 0 || end < 0 || bundle.indexOf(startMarker, start + 1) >= 0) {
      throw new Error('Evolution bundle does not match the pinned v2.3.7 patch target');
    }

    const replacement =
      'async findContactByIdentifier(s,e){' +
      'let t=await this.clientCw(s);' +
      'if(!t)return this.logger.warn("client not found"),null;' +
      'let o=await xs(this.getClientCwConfig(),{' +
      'method:"POST",' +
      'url:`/api/v1/accounts/${this.provider.accountId}/contacts/filter`,' +
      'body:{payload:[{attribute_key:"identifier",filter_operator:"equal_to",values:[e],query_operator:null}]}' +
      '});' +
      'return o&&o.payload&&o.payload.length>0?o.payload[0]:null' +
      '}async findContact(s,e){';

    const patched = bundle.slice(0, start) + replacement + bundle.slice(end + endMarker.length);
    fs.writeFileSync(bundlePath, patched);
    console.log('Applied Evolution v2.3.7 Chatwoot duplicate-contact fallback patch');
