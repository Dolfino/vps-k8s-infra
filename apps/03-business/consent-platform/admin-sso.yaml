apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-admin-sso
  labels: {app.kubernetes.io/name: consent-admin-sso, app.kubernetes.io/component: authentication}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: consent-admin-sso}
  template:
    metadata:
      labels: {app.kubernetes.io/name: consent-admin-sso, app.kubernetes.io/component: authentication}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.qez.com.br/realms/qez
            - --client-id=consent-admin
            - --redirect-url=https://consent.qez.com.br/oauth2/callback
            - --code-challenge-method=S256
            - --scope=openid profile email roles
            - --email-domain=*
            - --insecure-oidc-allow-unverified-email=true
            - --upstream=http://consent-platform.business.svc.cluster.local:3333
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --trusted-proxy-ip=10.42.0.0/16
            - --skip-provider-button=true
            - --cookie-name=__Host-consent_sso
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --cookie-refresh=5m
            - --pass-user-headers=true
            - --pass-access-token=false
            - --pass-authorization-header=true
            - --skip-auth-strip-headers=false
            - --set-authorization-header=false
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: consent-admin-sso, key: OAUTH2_PROXY_CLIENT_SECRET}}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: consent-admin-sso, key: OAUTH2_PROXY_COOKIE_SECRET}}
          ports: [{name: http, containerPort: 4180, protocol: TCP}]
          readinessProbe: {httpGet: {path: /ping, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /ping, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: consent-admin-sso
  labels: {app.kubernetes.io/name: consent-admin-sso}
spec:
  selector: {app.kubernetes.io/name: consent-admin-sso}
  ports: [{name: http, port: 4180, targetPort: http}]
