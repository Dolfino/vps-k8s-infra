apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: consent-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: consent.qez.com.br
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service: {name: consent-admin-sso, port: {number: 4180}}
          - path: /v1/admin
            pathType: Prefix
            backend:
              service: {name: consent-admin-sso, port: {number: 4180}}
          - path: /admin.html
            pathType: Exact
            backend:
              service: {name: consent-admin-sso, port: {number: 4180}}
          - path: /admin.js
            pathType: Exact
            backend:
              service: {name: consent-admin-sso, port: {number: 4180}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: consent-platform
                port:
                  number: 3333
  tls:
    - hosts:
        - consent.qez.com.br
      secretName: consent-qez-com-br-tls
