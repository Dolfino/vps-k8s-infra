apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: auth.qez.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: identity-platform, port: {number: 8080}}
  tls:
    - hosts: [auth.qez.com.br]
      secretName: identity-platform-tls

