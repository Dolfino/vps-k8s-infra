apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-platform
  labels:
    app.kubernetes.io/name: identity-platform
    app.kubernetes.io/component: identity-provider
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-platform
        app.kubernetes.io/component: identity-provider
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
          imagePullPolicy: IfNotPresent
          args: [start, --import-realm]
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://postgres.storage.svc.cluster.local:5432/keycloak"}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: identity-runtime, key: KC_DB_USERNAME}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: identity-runtime, key: KC_DB_PASSWORD}}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: identity-runtime, key: KC_BOOTSTRAP_ADMIN_USERNAME}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: identity-runtime, key: KC_BOOTSTRAP_ADMIN_PASSWORD}}
            - name: PORTAL_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: identity-runtime, key: PORTAL_CLIENT_SECRET}}
            - name: INITIAL_USER_PASSWORD
              valueFrom: {secretKeyRef: {name: identity-runtime, key: INITIAL_USER_PASSWORD}}
            - {name: KC_HOSTNAME, value: "https://auth.qez.com.br"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_PROXY_TRUSTED_ADDRESSES, value: "10.42.0.0/16"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_METRICS_ENABLED, value: "true"}
            - {name: KC_HTTP_MANAGEMENT_SCHEME, value: http}
            - {name: KC_CACHE, value: local}
            - {name: KC_LOG_LEVEL, value: info}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: realm-import, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: realm-import
          configMap:
            name: identity-realm-import
        - name: tmp
          emptyDir: {}


