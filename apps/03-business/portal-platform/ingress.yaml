apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: app.qez.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: portal-platform, port: {number: 4180}}
  tls:
    - hosts: [app.qez.com.br]
      secretName: portal-platform-tls

