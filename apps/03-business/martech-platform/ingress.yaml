apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: martech-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: martech.qez.com.br
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service: {name: martech-admin-sso, port: {number: 4180}}
          - path: /v1/admin
            pathType: Prefix
            backend:
              service: {name: martech-admin-sso, port: {number: 4180}}
          - path: /campaign-admin.html
            pathType: Exact
            backend:
              service: {name: martech-admin-sso, port: {number: 4180}}
          - path: /tracking-admin.html
            pathType: Exact
            backend:
              service: {name: martech-admin-sso, port: {number: 4180}}
          - path: /leads-admin.html
            pathType: Exact
            backend:
              service: {name: martech-admin-sso, port: {number: 4180}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: martech-platform, port: {number: 3340}}
  tls:
    - hosts: [martech.qez.com.br]
      secretName: martech-qez-com-br-tls
