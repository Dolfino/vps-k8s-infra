apiVersion: apps/v1
kind: Deployment
metadata:
  name: martech-platform
  labels: {app.kubernetes.io/name: martech-platform, app.kubernetes.io/component: api}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: martech-platform}
  template:
    metadata:
      labels: {app.kubernetes.io/name: martech-platform, app.kubernetes.io/component: api}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-secret}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/dolfino/martech-platform:3172e16a97ccd7900ae1aa276f01e75e57b03ca4
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 3340, protocol: TCP}]
          envFrom:
            - secretRef: {name: martech-platform-runtime}
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3340"}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: martech-platform
  labels: {app.kubernetes.io/name: martech-platform}
spec:
  selector: {app.kubernetes.io/name: martech-platform}
  ports: [{name: http, port: 3340, targetPort: http}]
