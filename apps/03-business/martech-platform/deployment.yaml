apiVersion: apps/v1
kind: Deployment
metadata:
  name: martech-platform
  labels: {app.kubernetes.io/name: martech-platform, app.kubernetes.io/component: api}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: martech-platform}
  template:
    metadata:
      labels: {app.kubernetes.io/name: martech-platform, app.kubernetes.io/component: api}
      annotations:
        platform.dolfino.io/runtime-revision: "nfc-touchpoints-v1"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-secret}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/dolfino/martech-platform:0363d18afc6f71adc0eaa02d8a34ec85547eaa20
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 3340, protocol: TCP}]
          envFrom:
            - secretRef: {name: martech-platform-runtime}
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3340"}
            - {name: MARTECH_PUBLIC_URL, value: "https://martech.qez.com.br"}
            # Public identifier embedded in the qez.com.br frontend. This is not
            # an authentication secret; request protection is layered with CORS,
            # validation, idempotency, honeypot and rate limiting.
            - {name: MARTECH_SITE_KEY, value: "qez_martech_public_key"}
            - {name: OIDC_ISSUER_URL, value: "https://auth.qez.com.br/realms/qez"}
            - {name: OIDC_AUDIENCE, value: "martech-admin"}
            # Route-level authorization separates full administration, marketing
            # management and restricted coupon redemption operations.
            - {name: OIDC_ADMIN_ROLES, value: "platform-superadmin,marketing-manager,operator"}
            - {name: LEGACY_ADMIN_TOKEN_ENABLED, value: "false"}
            - {name: IDENTITY_EMAIL_DELIVERY_MODE, value: "smtp"}
            - {name: IDENTITY_EMAIL_SMTP_HOST, value: "smtp.gmail.com"}
            - {name: IDENTITY_EMAIL_SMTP_PORT, value: "587"}
            - name: IDENTITY_EMAIL_SMTP_USERNAME
              valueFrom:
                secretKeyRef: {name: chatwoot-runtime-auth, key: SMTP_USERNAME}
            - name: IDENTITY_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef: {name: chatwoot-runtime-auth, key: SMTP_PASSWORD}
            - name: IDENTITY_EMAIL_FROM
              valueFrom:
                secretKeyRef: {name: chatwoot-runtime-auth, key: MAILER_SENDER_EMAIL}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: martech-platform
  labels: {app.kubernetes.io/name: martech-platform}
spec:
  selector: {app.kubernetes.io/name: martech-platform}
  ports: [{name: http, port: 3340, targetPort: http}]
