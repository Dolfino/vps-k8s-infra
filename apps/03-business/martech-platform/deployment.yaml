apiVersion: apps/v1
kind: Deployment
metadata:
  name: martech-platform
  labels: {app.kubernetes.io/name: martech-platform, app.kubernetes.io/component: api}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app.kubernetes.io/name: martech-platform}
  template:
    metadata:
      labels: {app.kubernetes.io/name: martech-platform, app.kubernetes.io/component: api}
      annotations:
        platform.dolfino.io/runtime-revision: "portal-root-v1"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-secret}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/dolfino/martech-platform@sha256:3eaffa3753683c37d5147c7273f8e36f264bbaee0b738d5e1e0dcf1c2acc82ba
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 3340, protocol: TCP}]
          envFrom:
            - secretRef: {name: martech-platform-runtime}
            - secretRef: {name: martech-push-runtime}
            - secretRef: {name: martech-push-queue-runtime}
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3340"}
            - {name: MARTECH_PUBLIC_URL, value: "https://martech.qez.com.br"}
            # Public identifier embedded in the qez.com.br frontend. This is not
            # an authentication secret; request protection is layered with CORS,
            # validation, idempotency, honeypot and rate limiting.
            - {name: MARTECH_SITE_KEY, value: "qez_martech_public_key"}
            # Website leads open directly in the commercial WhatsApp inbox so
            # agent replies are delivered by the Evolution Comercial instance.
            - {name: CHATWOOT_INBOX_ID, value: "10"}
            - {name: OIDC_ISSUER_URL, value: "https://auth.qez.com.br/realms/qez"}
            - {name: OIDC_AUDIENCE, value: "martech-admin"}
            - {name: PUSH_OIDC_AUDIENCE, value: "centrofashion-web"}
            - {name: PUSH_ALLOWED_ROLES, value: "merchant,platform-superadmin,marketing-manager"}
            # PN-01 controlled rollout: subscriptions and manual dispatch are
            # enabled; event-driven automations remain independently disabled.
            - {name: PUSH_SUBSCRIPTIONS_ENABLED, value: "true"}
            - {name: PUSH_DISPATCH_ENABLED, value: "true"}
            - {name: PUSH_AUTOMATIONS_ENABLED, value: "false"}
            # Route-level authorization separates full administration, marketing
            # management and restricted coupon redemption operations.
            - {name: OIDC_ADMIN_ROLES, value: "platform-superadmin,marketing-manager,analyst,operator"}
            - {name: LEGACY_ADMIN_TOKEN_ENABLED, value: "false"}
            # GF-02C.2 phase A publishes the operational infrastructure without
            # authorizing identity splits. Enabling it requires a second Go/No-Go.
            - {name: IDENTITY_SPLIT_ENABLED, value: "false"}
            - {name: IDENTITY_EMAIL_DELIVERY_MODE, value: "smtp"}
            - {name: IDENTITY_EMAIL_SMTP_HOST, value: "smtp.gmail.com"}
            - {name: IDENTITY_EMAIL_SMTP_PORT, value: "587"}
            - name: IDENTITY_EMAIL_SMTP_USERNAME
              valueFrom:
                secretKeyRef: {name: chatwoot-runtime-auth, key: SMTP_USERNAME}
            - name: IDENTITY_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef: {name: chatwoot-runtime-auth, key: SMTP_PASSWORD}
            - name: IDENTITY_EMAIL_FROM
              valueFrom:
                secretKeyRef: {name: chatwoot-runtime-auth, key: MAILER_SENDER_EMAIL}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: martech-push-worker
  labels: {app.kubernetes.io/name: martech-push-worker, app.kubernetes.io/component: worker}
spec:
  # Single worker for the controlled manual-dispatch rollout.
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: martech-push-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: martech-push-worker, app.kubernetes.io/component: worker}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-secret}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/dolfino/martech-platform@sha256:3eaffa3753683c37d5147c7273f8e36f264bbaee0b738d5e1e0dcf1c2acc82ba
          imagePullPolicy: Always
          command: ["node", "build/push-worker.js"]
          envFrom:
            - secretRef: {name: martech-platform-runtime}
            - secretRef: {name: martech-push-runtime}
            - secretRef: {name: martech-push-queue-runtime}
          env:
            - {name: NODE_ENV, value: production}
            - {name: MARTECH_PUBLIC_URL, value: "https://martech.qez.com.br"}
            - {name: OIDC_ISSUER_URL, value: "https://auth.qez.com.br/realms/qez"}
            - {name: PUSH_DISPATCH_ENABLED, value: "true"}
            - {name: PUSH_AUTOMATIONS_ENABLED, value: "false"}
            - {name: PUSH_WORKER_CONCURRENCY, value: "10"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: martech-platform
  labels: {app.kubernetes.io/name: martech-platform}
spec:
  selector: {app.kubernetes.io/name: martech-platform}
  ports: [{name: http, port: 3340, targetPort: http}]
