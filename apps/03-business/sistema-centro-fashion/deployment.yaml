apiVersion: apps/v1
kind: Deployment
metadata:
  name: sistema-centro-fashion-web
  namespace: business
  labels:
    app.kubernetes.io/name: sistema-centro-fashion-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sistema-centro-fashion-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sistema-centro-fashion-web
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: web
          image: ghcr.io/dolfino/sistema-centro-fashion-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sistema-centro-fashion-web
  namespace: business
spec:
  selector:
    app.kubernetes.io/name: sistema-centro-fashion-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sistema-centro-fashion-api
  namespace: business
  labels:
    app.kubernetes.io/name: sistema-centro-fashion-api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sistema-centro-fashion-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sistema-centro-fashion-api
        app.kubernetes.io/component: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api
          image: ghcr.io/dolfino/sistema-centro-fashion-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sistema-centro-fashion-db-auth
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sistema-centro-fashion-api
  namespace: business
spec:
  selector:
    app.kubernetes.io/name: sistema-centro-fashion-api
  ports:
    - name: http
      port: 3000
      targetPort: http
