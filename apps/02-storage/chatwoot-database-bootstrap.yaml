apiVersion: batch/v1
kind: Job
metadata:
  name: chatwoot-database-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: pgvector/pgvector:0.8.6-pg16-trixie
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -h "$PGHOST" -U "$PGUSER"; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -v app_user="$CHATWOOT_DB_USER" -v app_password="$CHATWOOT_DB_PASSWORD" -v app_db="$CHATWOOT_DB_NAME" <<'SQL'
              SET password_encryption = 'scram-sha-256';
              SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'app_user', :'app_password')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user')
              \gexec
              SELECT format('ALTER ROLE %I WITH PASSWORD %L', :'app_user', :'app_password')
              \gexec
              SELECT format('CREATE DATABASE %I OWNER %I ENCODING %L TEMPLATE template0', :'app_db', :'app_user', 'UTF8')
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'app_db')
              \gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', :'app_db', :'app_user')
              \gexec
              SQL
              psql -d "$CHATWOOT_DB_NAME" -v ON_ERROR_STOP=1 -v app_user="$CHATWOOT_DB_USER" <<'SQL'
              CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
              CREATE EXTENSION IF NOT EXISTS pg_trgm;
              CREATE EXTENSION IF NOT EXISTS pgcrypto;
              CREATE EXTENSION IF NOT EXISTS vector;
              SELECT format('ALTER SCHEMA public OWNER TO %I', :'app_user')
              \gexec
              SQL
          env:
            - name: PGHOST
              value: postgres.storage.svc.cluster.local
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
            - name: CHATWOOT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: chatwoot-db-auth
                  key: CHATWOOT_DB_USER
            - name: CHATWOOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatwoot-db-auth
                  key: CHATWOOT_DB_PASSWORD
            - name: CHATWOOT_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: chatwoot-db-auth
                  key: CHATWOOT_DB_NAME
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
