apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgbouncer
  ports:
    - name: postgresql
      port: 6432
      targetPort: postgresql
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: storage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer

  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: connection-pooler
        app.kubernetes.io/part-of: storage

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.2-p0
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP

          env:
            # Backend PostgreSQL
            - name: DB_HOST
              value: postgres.storage.svc.cluster.local

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: "*"

            - name: HEALTH_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-auth
                  key: PGBOUNCER_AUTH_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-auth
                  key: PGBOUNCER_AUTH_PASSWORD

            # Listener do PgBouncer
            - name: LISTEN_ADDR
              value: 0.0.0.0

            - name: LISTEN_PORT
              value: "5432"

            # Autenticação
            - name: AUTH_TYPE
              value: scram-sha-256

            - name: AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-auth
                  key: PGBOUNCER_AUTH_USER

            - name: AUTH_DBNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB

            - name: AUTH_QUERY
              value: SELECT username, password FROM pgbouncer.get_auth($1)

            - name: ADMIN_USERS
              value: pgbouncer_auth

            - name: STATS_USERS
              value: pgbouncer_auth

            # Estratégia de pooling
            - name: POOL_MODE
              value: transaction

            - name: MAX_CLIENT_CONN
              value: "100"

            - name: DEFAULT_POOL_SIZE
              value: "10"

            - name: MIN_POOL_SIZE
              value: "2"

            - name: RESERVE_POOL_SIZE
              value: "5"

            - name: RESERVE_POOL_TIMEOUT
              value: "5"

            - name: MAX_DB_CONNECTIONS
              value: "20"

            - name: MAX_USER_CONNECTIONS
              value: "20"

            # Prepared statements
            - name: MAX_PREPARED_STATEMENTS
              value: "200"

            # Timeouts
            - name: SERVER_IDLE_TIMEOUT
              value: "600"

            - name: SERVER_LIFETIME
              value: "3600"

            - name: SERVER_CONNECT_TIMEOUT
              value: "15"

            - name: SERVER_LOGIN_RETRY
              value: "5"

            - name: QUERY_WAIT_TIMEOUT
              value: "120"

            - name: IDLE_TRANSACTION_TIMEOUT
              value: "300"

            # Compatibilidade de clientes PostgreSQL
            - name: IGNORE_STARTUP_PARAMETERS
              value: extra_float_digits

            # Ambiente atual sem TLS interno
            - name: SERVER_TLS_SSLMODE
              value: disable

            # Logs
            - name: LOG_CONNECTIONS
              value: "0"

            - name: LOG_DISCONNECTIONS
              value: "0"

            - name: LOG_POOLER_ERRORS
              value: "1"

            - name: LOG_STATS
              value: "1"

            - name: STATS_PERIOD
              value: "60"

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  pg_isready
                  -h 127.0.0.1
                  -p 5432
                  -U "$DB_USER"
                  -d "$HEALTH_DB"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  pg_isready
                  -h 127.0.0.1
                  -p 5432
                  -U "$DB_USER"
                  -d "$HEALTH_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: postgresql
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer

            - name: pgbouncer-runtime
              mountPath: /var/run/pgbouncer

            - name: pgbouncer-tmp
              mountPath: /tmp

      volumes:
        - name: pgbouncer-config
          emptyDir: {}

        - name: pgbouncer-runtime
          emptyDir: {}

        - name: pgbouncer-tmp
          emptyDir: {}
