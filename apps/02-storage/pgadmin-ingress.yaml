apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pgadmin-https-redirect
  labels:
    app.kubernetes.io/name: pgadmin
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/component: database-admin
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: storage-pgadmin-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: pgadmin.ideiasmkt.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  number: 80
  tls:
    - hosts:
        - pgadmin.ideiasmkt.com.br
      secretName: pgadmin-tls
