apiVersion: batch/v1
kind: Job
metadata:
  name: consent-database-bootstrap
  labels:
    app.kubernetes.io/name: consent-database-bootstrap
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: consent-platform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consent-database-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: database-bootstrap
          image: postgres:17.6-alpine
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              psql -v ON_ERROR_STOP=1 \
                -v consent_user="$CONSENT_DB_USER" \
                -v consent_password="$CONSENT_DB_PASSWORD" \
                -v consent_database="$CONSENT_DB_NAME" <<'SQL'
              SET password_encryption = 'scram-sha-256';

              SELECT format(
                'CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION CONNECTION LIMIT 20 PASSWORD %L',
                :'consent_user', :'consent_password'
              )
              WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = :'consent_user')
              \gexec

              SELECT format(
                'ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION CONNECTION LIMIT 20 PASSWORD %L',
                :'consent_user', :'consent_password'
              )
              \gexec

              SELECT format(
                'CREATE DATABASE %I WITH OWNER %I ENCODING %L TEMPLATE template0',
                :'consent_database', :'consent_user', 'UTF8'
              )
              WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_database WHERE datname = :'consent_database')
              \gexec

              SELECT format('ALTER DATABASE %I OWNER TO %I', :'consent_database', :'consent_user')
              \gexec
              SELECT format('ALTER DATABASE %I SET timezone TO %L', :'consent_database', 'UTC')
              \gexec
              SELECT format('REVOKE CONNECT ON DATABASE %I FROM PUBLIC', :'consent_database')
              \gexec
              SELECT format('GRANT CONNECT, TEMPORARY ON DATABASE %I TO %I', :'consent_database', :'consent_user')
              \gexec
              SQL

              psql -d "$CONSENT_DB_NAME" -v ON_ERROR_STOP=1 -v consent_user="$CONSENT_DB_USER" <<'SQL'
              REVOKE CREATE ON SCHEMA public FROM PUBLIC;
              SELECT format('ALTER SCHEMA public OWNER TO %I', :'consent_user')
              \gexec
              SELECT format('GRANT USAGE, CREATE ON SCHEMA public TO %I', :'consent_user')
              \gexec
              SQL
          env:
            - name: PGHOST
              value: postgres.storage.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
            - name: CONSENT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: consent-db-auth
                  key: POSTGRES_USER
            - name: CONSENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: consent-db-auth
                  key: POSTGRES_PASSWORD
            - name: CONSENT_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: consent-db-auth
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
