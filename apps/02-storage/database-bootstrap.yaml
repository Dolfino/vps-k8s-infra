apiVersion: batch/v1
kind: Job
metadata:
  name: storage-database-bootstrap
  labels:
    app.kubernetes.io/name: storage-database-bootstrap
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: storage
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-database-bootstrap
        app.kubernetes.io/component: database-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: database-bootstrap
          image: pgvector/pgvector:0.8.6-pg16-trixie
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -ec

          args:
            - |
              echo "Iniciando bootstrap dos usuários e bancos..."

              psql \
                -v ON_ERROR_STOP=1 \
                -v evolution_user="$EVOLUTION_DB_USER" \
                -v evolution_password="$EVOLUTION_DB_PASSWORD" \
                -v evolution_database="$EVOLUTION_DB_NAME" \
                -v pgbouncer_user="$PGBOUNCER_AUTH_USER" \
                -v pgbouncer_password="$PGBOUNCER_AUTH_PASSWORD" \
                <<'SQL'
              SET password_encryption = 'scram-sha-256';

              -- Usuário de autenticação do PgBouncer.
              SELECT format(
                'CREATE ROLE %I LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION CONNECTION LIMIT 5 PASSWORD %L',
                :'pgbouncer_user',
                :'pgbouncer_password'
              )
              WHERE NOT EXISTS (
                SELECT 1
                FROM pg_catalog.pg_roles
                WHERE rolname = :'pgbouncer_user'
              )
              \gexec

              SELECT format(
                'ALTER ROLE %I WITH LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION CONNECTION LIMIT 5 PASSWORD %L',
                :'pgbouncer_user',
                :'pgbouncer_password'
              )
              \gexec

              -- Usuário proprietário da Evolution API.
              SELECT format(
                'CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION CONNECTION LIMIT 20 PASSWORD %L',
                :'evolution_user',
                :'evolution_password'
              )
              WHERE NOT EXISTS (
                SELECT 1
                FROM pg_catalog.pg_roles
                WHERE rolname = :'evolution_user'
              )
              \gexec

              SELECT format(
                'ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION CONNECTION LIMIT 20 PASSWORD %L',
                :'evolution_user',
                :'evolution_password'
              )
              \gexec

              -- Schema isolado para autenticação do PgBouncer.
              SELECT format(
                'CREATE SCHEMA pgbouncer AUTHORIZATION %I',
                current_user
              )
              WHERE NOT EXISTS (
                SELECT 1
                FROM pg_catalog.pg_namespace
                WHERE nspname = 'pgbouncer'
              )
              \gexec

              SELECT format(
                'ALTER SCHEMA pgbouncer OWNER TO %I',
                current_user
              )
              \gexec

              CREATE OR REPLACE FUNCTION pgbouncer.get_auth(p_username text)
              RETURNS TABLE(username text, password text)
              LANGUAGE sql
              SECURITY DEFINER
              SET search_path = pg_catalog
              AS $function$
                SELECT
                  rolname::text AS username,
                  CASE
                    WHEN rolvaliduntil IS NOT NULL
                     AND rolvaliduntil < now()
                    THEN NULL
                    ELSE rolpassword::text
                  END AS password
                FROM pg_catalog.pg_authid
                WHERE rolname = p_username
                  AND rolcanlogin
              $function$;

              REVOKE ALL
              ON FUNCTION pgbouncer.get_auth(text)
              FROM PUBLIC;

              SELECT format(
                'GRANT USAGE ON SCHEMA pgbouncer TO %I',
                :'pgbouncer_user'
              )
              \gexec

              SELECT format(
                'GRANT EXECUTE ON FUNCTION pgbouncer.get_auth(text) TO %I',
                :'pgbouncer_user'
              )
              \gexec

              SELECT format(
                'GRANT CONNECT ON DATABASE %I TO %I',
                current_database(),
                :'pgbouncer_user'
              )
              \gexec

              -- Banco da Evolution API.
              SELECT format(
                'CREATE DATABASE %I WITH OWNER %I ENCODING %L TEMPLATE template0',
                :'evolution_database',
                :'evolution_user',
                'UTF8'
              )
              WHERE NOT EXISTS (
                SELECT 1
                FROM pg_catalog.pg_database
                WHERE datname = :'evolution_database'
              )
              \gexec

              SELECT format(
                'ALTER DATABASE %I OWNER TO %I',
                :'evolution_database',
                :'evolution_user'
              )
              \gexec

              SELECT format(
                'ALTER DATABASE %I SET timezone TO %L',
                :'evolution_database',
                'UTC'
              )
              \gexec

              SELECT format(
                'REVOKE CONNECT ON DATABASE %I FROM PUBLIC',
                :'evolution_database'
              )
              \gexec

              SELECT format(
                'GRANT CONNECT, TEMPORARY ON DATABASE %I TO %I',
                :'evolution_database',
                :'evolution_user'
              )
              \gexec
              SQL

              psql \
                -d "$EVOLUTION_DB_NAME" \
                -v ON_ERROR_STOP=1 \
                -v evolution_user="$EVOLUTION_DB_USER" \
                <<'SQL'
              REVOKE CREATE ON SCHEMA public FROM PUBLIC;

              SELECT format(
                'ALTER SCHEMA public OWNER TO %I',
                :'evolution_user'
              )
              \gexec

              SELECT format(
                'GRANT USAGE, CREATE ON SCHEMA public TO %I',
                :'evolution_user'
              )
              \gexec
              SQL

              echo "Validando login direto de evolution_app..."

              PGUSER="$EVOLUTION_DB_USER" \
              PGPASSWORD="$EVOLUTION_DB_PASSWORD" \
              PGDATABASE="$EVOLUTION_DB_NAME" \
              psql \
                -v ON_ERROR_STOP=1 \
                -c "SELECT current_database(), current_user;"

              echo "Bootstrap concluído."

          env:
            # Acesso administrativo direto.
            - name: PGHOST
              value: postgres.storage.svc.cluster.local

            - name: PGPORT
              value: "5432"

            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD

            # Evolution API.
            - name: EVOLUTION_DB_USER
              valueFrom:
                secretKeyRef:
                  name: evolution-db-auth
                  key: POSTGRES_USER

            - name: EVOLUTION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: evolution-db-auth
                  key: POSTGRES_PASSWORD

            - name: EVOLUTION_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: evolution-db-auth
                  key: POSTGRES_DB

            # Autenticação do PgBouncer.
            - name: PGBOUNCER_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-auth
                  key: PGBOUNCER_AUTH_USER

            - name: PGBOUNCER_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-auth
                  key: PGBOUNCER_AUTH_PASSWORD

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
